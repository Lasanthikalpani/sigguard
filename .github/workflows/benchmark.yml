name: SigGuard Benchmark

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 0 * * 0'

jobs:
  benchmark:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: sigguard
          POSTGRES_PASSWORD: sigguard123
          POSTGRES_DB: sigguard
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install -e .

      - name: Init database
        env:
          PGPASSWORD: sigguard123
        run: |
          psql -h localhost -U sigguard -d sigguard -f docker/init.sql

      - name: Run benchmark
        env:
          DATABASE_URL: postgresql://sigguard:sigguard123@localhost:5432/sigguard
        run: |
          python scripts/first_experiment.py

      - name: Upload results
        uses: actions/upload-artifact@v3
        with:
          name: benchmark-results
          path: |
            models/checkpoints/
            logs/
